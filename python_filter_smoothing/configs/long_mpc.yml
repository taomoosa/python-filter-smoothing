# Low-rate, long-horizon MPC used only to generate a moving reference path.
robot:
  config: franka.yml
  velocity_limit_scale: 1.0
  acceleration_limit_scale: 1.0
  jerk_limit_scale: 1.0

scene: ../scenes/desk.yml

timing:
  optimization_dt_s: 0.020
  interpolation_steps: 4
  control_points: 32

optimizer:
  base_config: mpc/lbfgs_mpc.yml
  tool_pose_weight: [50000.0, 1000.0]
  non_terminal_tool_pose_weight_factor: 0.20
  cspace_bound_weight: [1000.0, 1000.0, 1000.0, 100.0, 0.0]
  squared_l2_regularization_weight: [0.01, 5000.0, 500.0, 0.0, 0.0]
  scene_collision_weight: 100000.0
  warm_start_iterations: 150
  # setup() initializes a cheap hold-goal seed.
  cold_start_iterations: 300
  fixed_iterations: true
  return_best_action: true
  target_update:
    # Keep every feasible independent solve. More iterations can improve pose
    # error while losing feasibility, so the final solve is not privileged.
    candidate_iterations: [50, 100, 200, 400, 1100]
    use_ik_joint_reference: true
    seed_from_ik: true
    ik_fallback_seeds: 8

collision:
  activation_distance_m: 0.01
  self_collision_check: true

runtime:
  use_cuda_graph: true
  random_seed: 123
