cuboid:
  floor_table:
    dims: [1.4, 1.4, 0.05]
    pose: [0.0, 0.0, -0.05, 1.0, 0.0, 0.0, 0.0]
  desk_sized_block:
    # The arm never operates below the desk. Model the tabletop as a deep solid
    # so the optimizer cannot escape an unreachable goal through its underside.
    # center_z=0.30 and height=2.00 place the top surface at z=1.30 m.
    dims: [0.45, 0.65, 2.0]
    pose: [0.85, -0.55, 0.30, 1.0, 0.0, 0.0, 0.0]
